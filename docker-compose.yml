# Manual three-slot Steel diagnostic stack. The application normally creates
# these same named containers with each active job's private profile directory.
x-steel: &steel
  image: ghcr.io/steel-dev/steel-browser@sha256:21cf2a5785aa9478d0f7933c04bce96ca79f3d7a93d9824ea184800d29d3cd02
  restart: unless-stopped
  init: true
  shm_size: "2gb"
  mem_limit: "6gb"
  memswap_limit: "6gb"
  cpus: 2.0
  profiles: ["manual"]
  environment:
    FILTER_CHROME_ARGS: "--disable-dev-shm-usage"

services:
  steel-1:
    <<: *steel
    container_name: cvent-agent-steel-1
    ports:
      - "127.0.0.1:3005:3000"
      - "127.0.0.1:9334:9223"
    volumes:
      - ./data/manual-slots/1/cache:/app/.cache
      - ./data/manual-slots/1/profile:/tmp/steel-chrome
  steel-2:
    <<: *steel
    container_name: cvent-agent-steel-2
    ports:
      - "127.0.0.1:3006:3000"
      - "127.0.0.1:9335:9223"
    volumes:
      - ./data/manual-slots/2/cache:/app/.cache
      - ./data/manual-slots/2/profile:/tmp/steel-chrome
  steel-3:
    <<: *steel
    container_name: cvent-agent-steel-3
    ports:
      - "127.0.0.1:3007:3000"
      - "127.0.0.1:9336:9223"
    volumes:
      - ./data/manual-slots/3/cache:/app/.cache
      - ./data/manual-slots/3/profile:/tmp/steel-chrome
